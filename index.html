<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operación Órbita · 5.º Primaria</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243c;background:#eaf2fa}*{box-sizing:border-box}body{margin:0}.app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px}.shell{width:min(1100px,100%);min-height:min(730px,calc(100dvh - 24px));background:#fff;border:2px solid #d9e5f1;border-radius:22px;box-shadow:0 12px 35px #1a37501c;overflow:hidden;display:flex;flex-direction:column}.top{background:#16325b;color:#fff;padding:13px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;font-size:1.2rem}.tag{font-size:.8rem;background:#ffffff20;padding:7px 11px;border-radius:99px}.content{flex:1;padding:22px;display:flex;flex-direction:column;gap:15px}.center{align-items:center;justify-content:center;text-align:center}.eyebrow{font-size:.8rem;letter-spacing:.12em;font-weight:900;color:#3c6b9b}.big{font-size:clamp(2rem,5vw,3.7rem);margin:0}.lead{font-size:1.12rem;max-width:680px;line-height:1.55}.steps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.pill{border:2px solid #d9e5f1;border-radius:12px;padding:12px 15px;font-weight:750;background:#f5f9fe}.btn{border:0;background:#1768b4;color:#fff;font:inherit;font-weight:800;padding:13px 20px;border-radius:12px;cursor:pointer;min-height:49px}.btn:focus-visible,.choice:focus-visible,input:focus-visible{outline:4px solid #f4b740;outline-offset:3px}.btn.alt{background:#e9f2fb;color:#174b7d}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.game{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:17px;flex:1}.panel{border:2px solid #dce7f2;border-radius:16px;padding:17px;min-width:0}.panel.tint{background:#f5f9fe}.h2{font-size:1.15rem;margin:0 0 10px}.muted{color:#54708c}.progress{height:9px;background:#e4edf5;border-radius:10px;overflow:hidden}.bar{height:100%;background:#19a6a1;transition:width .2s}.expression{display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:4px;margin:23px 0 9px;min-height:90px}.token{display:flex;flex-direction:column;align-items:center;min-width:34px;font-size:clamp(1.4rem,3vw,2.1rem);font-weight:800}.token .arrow{height:30px;font-size:22px;color:#e17a22}.token.active{color:#a84c00;background:#fff0d9;border-radius:7px}.token.active .arrow{font-weight:900}.token.paren{color:#64748b}.question{font-size:1.15rem;font-weight:800;margin:12px 0}.answer{width:150px;max-width:100%;border:2px solid #aac4dd;border-radius:12px;font-size:1.7rem;padding:9px;text-align:center;font-weight:750}.hint{padding:12px;background:#fff5df;border-radius:12px;color:#684514}.feedback{min-height:48px;padding:11px;border-radius:10px;background:#edf5fd;font-weight:700}.feedback.good{background:#e5f8ed;color:#126438}.feedback.bad{background:#fff0ed;color:#9c3d25}.guide{display:grid;gap:9px}.guide div{padding:11px;background:white;border-radius:11px;border:1px solid #dce7f2}.guide .current{border:2px solid #e6a63a;background:#fff6e5}.small{font-size:.88rem}.footer{padding:12px 22px;border-top:1px solid #e0e9f2;color:#58718c;font-size:.8rem;display:flex;justify-content:space-between}.example{background:#f1f7fe;border:2px solid #d8e7f7;padding:16px;border-radius:14px;text-align:left;max-width:700px;width:100%;line-height:1.85}.example strong{color:#1b5c98}.badge{background:#e5f3f2;color:#126b69;border-radius:50px;padding:6px 11px;font-weight:800;font-size:.82rem}.choice{border:2px solid #d7e5f2;background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:800;cursor:pointer}.choice:hover{background:#eff7fe}.hidden{display:none!important}@media(max-width:720px){.game{grid-template-columns:1fr}.content{padding:14px}.shell{min-height:calc(100dvh - 24px)}.top{padding:12px}.panel{padding:13px}.expression{margin:8px 0}.guide{grid-template-columns:1fr 1fr}.guide div{font-size:.85rem}.footer{padding:10px 13px}}@media(min-width:721px) and (max-height:780px){.content{padding:13px;gap:9px}.panel{padding:12px}.expression{margin:9px 0;min-height:68px}.token .arrow{height:25px}.guide div{padding:8px}}
</style></head><body><main class="app"><div class="shell"><header class="top"><div class="logo">🚀 OPERACIÓN ÓRBITA</div><div class="tag" id="topTag">Entrenamiento matemático</div></header><section id="screen" class="content center"></section><footer class="footer"><span>Operaciones combinadas · 5.º de Primaria</span><span>Sin cronómetro · Paso a paso</span></footer></div></main><script>
const exercises=[
{label:'Primeros pasos',expr:'8 + 3 × 2',steps:[{find:'3 × 2',ans:6,next:'8 + 6',kind:1},{find:'8 + 6',ans:14,next:'14',kind:2}]},
{label:'Primeros pasos',expr:'20 - 4 × 3',steps:[{find:'4 × 3',ans:12,next:'20 - 12',kind:1},{find:'20 - 12',ans:8,next:'8',kind:2}]},
{label:'Primeros pasos',expr:'18 ÷ 3 + 5',steps:[{find:'18 ÷ 3',ans:6,next:'6 + 5',kind:1},{find:'6 + 5',ans:11,next:'11',kind:2}]},
{label:'Con paréntesis',expr:'( 6 + 4 ) × 2',steps:[{find:'6 + 4',ans:10,next:'10 × 2',kind:0},{find:'10 × 2',ans:20,next:'20',kind:1}]},
{label:'Con paréntesis',expr:'24 ÷ ( 2 + 4 )',steps:[{find:'2 + 4',ans:6,next:'24 ÷ 6',kind:0},{find:'24 ÷ 6',ans:4,next:'4',kind:1}]},
{label:'Con paréntesis',expr:'30 - ( 8 + 7 )',steps:[{find:'8 + 7',ans:15,next:'30 - 15',kind:0},{find:'30 - 15',ans:15,next:'15',kind:2}]},
{label:'Dos operaciones',expr:'6 × 4 - 12 ÷ 3',steps:[{find:'6 × 4',ans:24,next:'24 - 12 ÷ 3',kind:1},{find:'12 ÷ 3',ans:4,next:'24 - 4',kind:1},{find:'24 - 4',ans:20,next:'20',kind:2}]},
{label:'Dos operaciones',expr:'5 + 18 ÷ 3 × 2',steps:[{find:'18 ÷ 3',ans:6,next:'5 + 6 × 2',kind:1},{find:'6 × 2',ans:12,next:'5 + 12',kind:1},{find:'5 + 12',ans:17,next:'17',kind:2}]},
{label:'Dos operaciones',expr:'40 - 6 × 5 + 2',steps:[{find:'6 × 5',ans:30,next:'40 - 30 + 2',kind:1},{find:'40 - 30',ans:10,next:'10 + 2',kind:2},{find:'10 + 2',ans:12,next:'12',kind:2}]},
{label:'Reto final',expr:'( 12 + 8 ) ÷ 4 + 6',steps:[{find:'12 + 8',ans:20,next:'20 ÷ 4 + 6',kind:0},{find:'20 ÷ 4',ans:5,next:'5 + 6',kind:1},{find:'5 + 6',ans:11,next:'11',kind:2}]},
{label:'Reto final',expr:'3 × ( 9 - 5 ) + 8',steps:[{find:'9 - 5',ans:4,next:'3 × 4 + 8',kind:0},{find:'3 × 4',ans:12,next:'12 + 8',kind:1},{find:'12 + 8',ans:20,next:'20',kind:2}]},
{label:'Reto final',expr:'50 - ( 6 × 4 + 8 )',steps:[{find:'6 × 4',ans:24,next:'50 - ( 24 + 8 )',kind:0},{find:'24 + 8',ans:32,next:'50 - 32',kind:0},{find:'50 - 32',ans:18,next:'18',kind:2}]}
];
let index=0,stepIndex=0,expr='',errors=0,showHint=false,solved=false;const screen=document.getElementById('screen'),tag=document.getElementById('topTag');
function start(){screen.className='content center';tag.textContent='Antes de empezar';screen.innerHTML=`<div class="eyebrow">MISIÓN DE CÁLCULO</div><h1 class="big">🚀 Operación Órbita</h1><p class="lead">Resuelve operaciones combinadas para encender los motores de una nave espacial. <strong>Tú haces los cálculos.</strong> El juego te indica qué parte toca resolver.</p><div class="steps"><div class="pill">👀 1. MIRO</div><div class="pill">⬇️ 2. SIGO LA FLECHA</div><div class="pill">✏️ 3. CALCULO</div><div class="pill">✅ 4. COMPRUEBO</div></div><button class="btn" onclick="instructions()">Ver cómo se juega →</button>`}
function instructions(){screen.innerHTML=`<div class="eyebrow">ANTES DE JUGAR</div><h1 class="big" style="font-size:2.2rem">Sigo siempre el mismo orden</h1><div class="steps"><div class="pill">① Paréntesis ( )</div><div class="pill">② Multiplicar × y dividir ÷</div><div class="pill">③ Sumar + y restar −</div></div><p class="muted">Cuando hay operaciones del mismo nivel, voy de izquierda a derecha.</p><div class="example"><strong>Ejemplo:</strong> 4 + 3 × 2<br><strong>⬆ Primero:</strong> 3 × 2 = 6<br><strong>Escribo la operación nueva:</strong> 4 + 6<br><strong>⬆ Después:</strong> 4 + 6 = 10<br><strong>Resultado:</strong> 10</div><p class="small muted">En cada pantalla verás una flecha debajo de la operación que tienes que resolver. Escribe el resultado y pulsa «Comprobar».</p><button class="btn" onclick="begin()">Comenzar el juego 🚀</button>`}
function begin(){index=0;errors=0;load()}
function load(){stepIndex=0;expr=exercises[index].expr;showHint=false;solved=false;render()}
function highlighted(expression,find){let tokens=expression.split(' '),target=find.split(' '),at=-1;for(let i=0;i<=tokens.length-target.length;i++){if(target.every((t,j)=>tokens[i+j]===t)){at=i;break}}return tokens.map((t,i)=>{let active=i>=at&&i<at+target.length;return `<div class="token ${active?'active':''} ${t==='('||t===')'?'paren':''}"><span>${t.replaceAll('&','&amp;')}</span><span class="arrow">${active?'↑':' '}</span></div>`}).join('')}
function render(message='',type=''){const ex=exercises[index],st=ex.steps[stepIndex];screen.className='content';tag.textContent=`Reto ${index+1} de ${exercises.length}`;screen.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${ex.label.toUpperCase()}</div><h1 style="margin:4px 0;font-size:1.55rem">Resuelve paso a paso</h1></div><span class="badge">${index+1} / ${exercises.length} retos</span></div><div class="progress"><div class="bar" style="width:${(index/exercises.length)*100}%"></div></div><div class="game"><div class="panel"><div class="muted small">Operación actual</div><div class="expression" aria-label="${expr}">${highlighted(expr,st.find)}</div><div class="question">⬆ Resuelve la parte señalada: <span style="color:#a84c00">${st.find}</span></div><div class="row"><label for="ans" class="small" style="font-weight:800">Escribe el resultado:</label><input id="ans" class="answer" type="number" inputmode="numeric" autocomplete="off" aria-label="Resultado de la parte señalada" onkeydown="if(event.key==='Enter')check()"><button class="btn" onclick="check()">Comprobar ✓</button></div><div id="feedback" class="feedback ${type}">${message||'Haz la cuenta y escribe el resultado.'}</div><div class="row"><button class="btn alt" onclick="hint()">💡 ${showHint?'Ocultar ayuda':'Necesito una pista'}</button><button class="btn alt" onclick="instructions()">📖 Ver ejemplo</button></div>${showHint?`<div class="hint">${st.kind===0?'Primero resuelve lo que está dentro del paréntesis.':st.kind===1?'Multiplica o divide antes de sumar o restar. Si hay varias, empieza por la izquierda.':'Ahora suma o resta de izquierda a derecha.'} <strong>La parte que debes calcular es ${st.find}.</strong></div>`:''}</div><aside class="panel tint"><h2 class="h2">📋 Sigo los pasos</h2><div class="guide"><div class="${st.kind===0?'current':''}">① <strong>PARÉNTESIS</strong><br><span class="small muted">Primero ( )</span></div><div class="${st.kind===1?'current':''}">② <strong>× y ÷</strong><br><span class="small muted">De izquierda a derecha</span></div><div class="${st.kind===2?'current':''}">③ <strong>+ y −</strong><br><span class="small muted">De izquierda a derecha</span></div></div><p class="small muted">No tengo que resolver toda la operación de golpe. Solo la parte marcada.</p><div class="pill" style="text-align:center">Paso ${stepIndex+1} de ${ex.steps.length}</div></aside></div>`;document.getElementById('ans').focus()}
function hint(){showHint=!showHint;render()}
function check(){const inp=document.getElementById('ans');if(!inp||inp.value.trim()==='')return feedback('Primero escribe un número.','bad');let n=Number(inp.value),st=exercises[index].steps[stepIndex];if(n!==st.ans){errors++;feedback('Todavía no. Revisa la parte señalada y vuelve a intentarlo.','bad');inp.select();return}expr=st.next;stepIndex++;showHint=false;if(stepIndex===exercises[index].steps.length){solved=true;finishExercise()}else render('¡Bien! La operación se ha actualizado. Sigue la siguiente flecha.','good')}
function feedback(m,c){let el=document.getElementById('feedback');el.textContent=m;el.className='feedback '+c}
function finishExercise(){screen.className='content center';let last=index===exercises.length-1;tag.textContent=last?'Misión completada':`Reto ${index+1} completado`;screen.innerHTML=`<div class="eyebrow">${last?'MISIÓN SUPERADA':'OPERACIÓN RESUELTA'}</div><h1 class="big">${last?'🏆 ¡Nave en órbita!':'⭐ ¡Buen trabajo!'}</h1><p class="lead">${last?'Has terminado los 12 retos de operaciones combinadas.':'Has resuelto la operación siguiendo los pasos.'}</p><div class="example" style="text-align:center"><div class="muted">Operación</div><strong style="font-size:1.35rem">${exercises[index].expr} = ${expr}</strong></div>${last?`<p>Intentos que necesitaste corregir: <strong>${errors}</strong></p><button class="btn" onclick="start()">Volver a jugar ↻</button>`:`<button class="btn" onclick="index++;load()">Siguiente reto →</button>`}`}
start();
</script></body></html>
